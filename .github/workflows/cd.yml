name: CD

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 이미지 태그. 비우면 현재 커밋으로 빌드합니다. 롤백 시 이전 SHA 태그를 입력하세요.'
        required: false
        type: string

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 409513748970.dkr.ecr.ap-northeast-2.amazonaws.com
  BACKEND_REPOSITORY: homerun-backend
  AI_REPOSITORY: homerun-ai-coach
  DEPLOY_DIR: /opt/homerun

jobs:
  build:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: meta
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: 백엔드 이미지 빌드 및 ECR 업로드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: AI Coach 이미지 빌드 및 ECR 업로드
        uses: docker/build-push-action@v6
        with:
          context: ./ai-coach
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.AI_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=ai-coach
          cache-to: type=gha,mode=max,scope=ai-coach

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.image_tag) }}
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포할 이미지 태그 결정
        id: image
        run: echo "tag=${{ inputs.image_tag || needs.build.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: SSM으로 EC2 배포
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          commands=$(jq -nc \
            --arg dir "$DEPLOY_DIR" \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg backend "$BACKEND_REPOSITORY" \
            --arg ai "$AI_REPOSITORY" \
            --arg tag "$IMAGE_TAG" \
            '[
              "set -e",
              "cd \($dir)",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "export IMAGE=\($registry)/\($backend):\($tag)",
              "export AI_COACH_IMAGE=\($registry)/\($ai):\($tag)",
              "docker compose -f compose.prod.yaml pull app ai-coach",
              "docker compose -f compose.prod.yaml up -d --no-build --remove-orphans",
              "docker compose -f compose.prod.yaml ps"
            ]')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=$commands" \
            --comment "Deploy $IMAGE_TAG" \
            --query 'Command.CommandId' \
            --output text \
            --region "$AWS_REGION")

          echo "SSM command: $command_id"

          if ! aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION"; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
              --output json \
              --region "$AWS_REGION" || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
            --output json \
            --region "$AWS_REGION"
