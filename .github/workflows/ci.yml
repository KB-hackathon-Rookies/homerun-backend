name: CI

on:
  push:
    # 기본 브랜치가 dev 다. main 만 걸어 두면 정작 개발이 오가는 브랜치에서 CI 가 안 돈다.
    branches: [main, dev]
  pull_request:

# 같은 브랜치에 연속으로 푸시하면 앞선 실행은 취소한다. 러너 대기열을 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gradle-wrapper.jar 는 바이너리라 리뷰에서 걸러지지 않는다. 공식 배포본과 대조한다.
      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 의존성/빌드 캐시. 없으면 매 실행마다 전체를 다시 받는다.
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # build = compileJava + spotlessCheck + test.
      # 테스트는 Testcontainers 로 진짜 PostgreSQL 을 띄운다(러너에 Docker 가 있다).
      - name: 빌드 및 테스트
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
