spring:
  application:
    name: homerun_backend
  config:
    # 로컬 IDE 실행에서도 프로젝트 루트의 .env를 읽는다.
    # 운영 환경에서는 실제 환경변수가 같은 이름으로 이 값을 덮어쓴다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:homerun}
    username: ${POSTGRES_USER:homerun}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

external-api:
  resilience:
    connect-timeout: ${EXTERNAL_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${EXTERNAL_API_READ_TIMEOUT:5s}
    max-attempts: ${EXTERNAL_API_MAX_ATTEMPTS:2}
    retry-backoff: ${EXTERNAL_API_RETRY_BACKOFF:200ms}
  juso:
    base-url: https://business.juso.go.kr/addrlink
    confirm-key: ${JUSO_CONFIRM_KEY:}
  building-register:
    base-url: https://apis.data.go.kr/1613000/BldRgstHubService
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    endpoints:
      title: /getBrTitleInfo
      housing-price: /getBrHsprcInfo
  real-estate-transaction:
    base-url: https://apis.data.go.kr
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    endpoints:
      apartment: /1613000/RTMSDataSvcAptRent/getRTMSDataSvcAptRent
      officetel: /1613000/RTMSDataSvcOffiRent/getRTMSDataSvcOffiRent
      row-house: /1613000/RTMSDataSvcRHRent/getRTMSDataSvcRHRent
  open-banking:
    oauth-base-url: ${OPEN_BANKING_OAUTH_BASE_URL:https://testapi.openbanking.or.kr}
    api-base-url: ${OPEN_BANKING_API_BASE_URL:https://testapi.openbanking.or.kr}
    client-id: ${OPEN_BANKING_CLIENT_ID:}
    client-secret: ${OPEN_BANKING_CLIENT_SECRET:}
    client-use-code: ${OPEN_BANKING_CLIENT_USE_CODE:}
    redirect-uri: ${OPEN_BANKING_REDIRECT_URI:http://localhost:8080/api/v1/open-banking/callback}
    scope: ${OPEN_BANKING_SCOPE:login inquiry}
    token-encryption-key: ${OPEN_BANKING_TOKEN_ENCRYPTION_KEY:}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}

app:
  jwt:
    # 32자 이상의 무작위 문자열을 넣는다. 예: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:14}
  auth-cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
  email-verification:
    secret: ${EMAIL_VERIFICATION_SECRET:}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    code-ttl: 5m
    verified-token-ttl: 10m
    resend-cooldown: 1m
    send-window: 30m
    max-sends-per-window: 5
    max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
