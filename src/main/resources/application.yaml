spring:
  application:
    name: homerun_backend
  config:
    # 로컬 IDE 실행에서도 프로젝트 루트의 .env를 읽는다.
    # 운영 환경에서는 실제 환경변수가 같은 이름으로 이 값을 덮어쓴다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:homerun}
    username: ${POSTGRES_USER:homerun}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # k6 40 VU 부하 시험으로 정한 값이다. 기본 10 은 활성 커넥션이 10/10 으로 포화해 커넥션
      # 획득에만 240ms 를 쓴다. 30 이 처리량은 가장 높았지만(955 req/s) 쓰기(판정) p95 가
      # 606ms 로 밀렸고, 20 은 처리량의 93% 를 내면서 433ms 로 끊었다. 판정은 사용자가 화면에서
      # 기다리는 요청이라 이쪽을 우선한다. 50 은 오히려 819 req/s 로 떨어진다 — 대기 스레드가
      # 0 이었으니 풀이 모자란 게 아니라 커넥션이 많아 DB 가 경합한 것이다.
      # env 로 뺀 이유: `인스턴스 수 x 풀 크기 < postgres max_connections` 를 넘기면 앱이 아니라
      # DB 가 커넥션을 거절한다. 인스턴스를 늘릴 때 코드를 고치지 않고 줄일 수 있어야 한다.
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

external-api:
  resilience:
    connect-timeout: ${EXTERNAL_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${EXTERNAL_API_READ_TIMEOUT:5s}
    max-attempts: ${EXTERNAL_API_MAX_ATTEMPTS:2}
    retry-backoff: ${EXTERNAL_API_RETRY_BACKOFF:200ms}
  juso:
    base-url: https://business.juso.go.kr/addrlink
    confirm-key: ${JUSO_CONFIRM_KEY:}
  building-register:
    base-url: https://apis.data.go.kr/1613000/BldRgstHubService
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    endpoints:
      title: /getBrTitleInfo
      housing-price: /getBrHsprcInfo
  real-estate-transaction:
    base-url: https://apis.data.go.kr
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    endpoints:
      apartment: /1613000/RTMSDataSvcAptRent/getRTMSDataSvcAptRent
      officetel: /1613000/RTMSDataSvcOffiRent/getRTMSDataSvcOffiRent
      row-house: /1613000/RTMSDataSvcRHRent/getRTMSDataSvcRHRent
  open-banking:
    oauth-base-url: ${OPEN_BANKING_OAUTH_BASE_URL:https://testapi.openbanking.or.kr}
    api-base-url: ${OPEN_BANKING_API_BASE_URL:https://testapi.openbanking.or.kr}
    client-id: ${OPEN_BANKING_CLIENT_ID:}
    client-secret: ${OPEN_BANKING_CLIENT_SECRET:}
    client-use-code: ${OPEN_BANKING_CLIENT_USE_CODE:}
    redirect-uri: ${OPEN_BANKING_REDIRECT_URI:http://localhost:8080/api/v1/open-banking/callback}
    scope: ${OPEN_BANKING_SCOPE:login inquiry}
    token-encryption-key: ${OPEN_BANKING_TOKEN_ENCRYPTION_KEY:}
    # 계좌·거래 조회 API 는 사업자 등록을 마친 이용기관만 호출할 수 있다. 등록 전 데모에서만 true 로
    # 켜서 조회 결과를 샘플 픽스처로 대체한다. 인가(OAuth)는 이 값과 무관하게 언제나 실제로 호출된다.
    mock-data: ${OPEN_BANKING_MOCK_DATA:false}
    # 페르소나를 고른 적 없는 회원에게 보여 줄 기본 프로필. 시연 대본이 "독립을 준비하는 평범한
    # 청년" 한 명으로 흐르므로 김국민이다. 다른 페르소나는 데모 적재 경로로 명시적으로 실었을
    # 때만 나온다. mock-data 가 false 면 이 값은 읽히지도 않는다.
    mock-persona: ${OPEN_BANKING_MOCK_PERSONA:KIM_KUKMIN}
  # AI 코치(FastAPI). 외부에 공개하지 않고 Spring 만 호출하는 내부 서비스다.
  # compose 로 띄우면 서비스 이름(http://ai-coach:8000)을 넣는다.
  ai-coach:
    base-url: ${AI_COACH_BASE_URL:http://localhost:8000}
    # 내부에서 LLM 을 부르므로 정상 응답도 공통 5초를 넘긴다.
    read-timeout: ${AI_COACH_READ_TIMEOUT:20s}

oauth:
  # 소셜 콜백이 끝난 뒤 브라우저를 돌려보낼 프론트 주소.
  frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:3000/auth/callback}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}

app:
  jwt:
    # 32자 이상의 무작위 문자열을 넣는다. 예: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:14}
  auth-cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    # 쿠키를 싣는 요청이라 와일드카드를 쓸 수 없다. 배포 주소가 생기면 콤마로 덧붙인다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  email-verification:
    secret: ${EMAIL_VERIFICATION_SECRET:}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    code-ttl: 5m
    verified-token-ttl: 10m
    resend-cooldown: 1m
    send-window: 30m
    max-sends-per-window: 5
    max-attempts: 5
  phone-verification:
    # 전용 시크릿이 비어 있으면 fallback-secret 을 쓴다. 대체는 PhoneVerificationProperties 가 한다.
    # 여기에 ${A:${B:}} 로 적으면 A 가 빈 값으로 정의된 경우 기본값이 무시된다.
    secret: ${PHONE_VERIFICATION_SECRET:}
    fallback-secret: ${EMAIL_VERIFICATION_SECRET:}
    code-ttl: 3m
    verified-token-ttl: 10m
    resend-cooldown: 1m
    send-window: 30m
    max-sends-per-window: 5
    max-attempts: 5
  sms:
    solapi:
      # 세 값이 모두 채워진 경우에만 Solapi 발송기가 활성화된다. 비어 있으면 SMS 스텁을 사용한다.
      api-key: ${SOLAPI_API_KEY:}
      api-secret: ${SOLAPI_API_SECRET:}
      sender: ${SOLAPI_SENDER:}

fcm:
  # 기본은 무동작(NoOpFcmSender). 실제 전송하려면 true 로 켜고 서비스계정 JSON 을 준다.
  enabled: ${FCM_ENABLED:false}
  # 서비스계정 JSON 원본, base64 인코딩 JSON, 또는 파일 경로 중 하나.
  credentials: ${FIREBASE_CREDENTIALS:}

notification:
  recovery:
    min-age: ${NOTIFICATION_RECOVERY_MIN_AGE:5m}
    batch-size: ${NOTIFICATION_RECOVERY_BATCH_SIZE:100}
    fixed-delay: ${NOTIFICATION_RECOVERY_FIXED_DELAY:60s}
  # 마감 스캔 실행 시각(KST). 기본 매일 09:00.
  deadline:
    cron: ${NOTIFICATION_DEADLINE_CRON:0 0 9 * * *}

management:
  endpoints:
    web:
      exposure:
        # prometheus 는 부하 시험·모니터링용이라 기본으로 켠다. 운영에서 외부에 열지 말 것.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: homerun-backend
    distribution:
      # 평균만 보면 느린 요청이 묻힌다. p95·p99 를 보려면 히스토그램이 있어야 한다.
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
