# 이 파일은 테스트 클래스패스에서 main 의 application.yaml 을 가린다.
# DataSource 는 TestcontainersConfiguration 의 @ServiceConnection 이 채워 주므로
# 여기서 url/username/password 를 잡지 않는다.
#
# flyway 를 켜 두는 게 핵심이다. 테스트가 실제 마이그레이션으로 만든 스키마 위에서
# 돌아야 ddl-auto: validate 가 의미를 가진다.
spring:
  mail:
    host: localhost
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

# 이 파일이 main 을 가리므로 app.* 기본값은 여기에도 있어야 한다.
app:
  cors:
    allowed-origins: http://localhost:3000

# Prometheus 레지스트리는 테스트에서 끈다.
#
# 이게 켜져 있으면 캐시된 스프링 컨텍스트(20개 이상)마다 레지스트리가 하나씩 올라가고
# JVM·HTTP·커넥션풀 미터를 전부 등록한다. 테스트 워커 힙(기본 512m)이 그걸 못 버텨서
# 전체 테스트가 OutOfMemoryError 로 멈춘다 — 실제로 이 의존성을 넣자마자 그렇게 됐다.
#
# 메트릭 노출 자체를 검증하는 테스트만 자기 @SpringBootTest 에서 다시 켠다.
management:
  prometheus:
    metrics:
      export:
        enabled: false
