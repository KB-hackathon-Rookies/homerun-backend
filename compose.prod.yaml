# 앱까지 컨테이너로 묶어 돌릴 때 쓴다. 서버 배포와 "컨테이너 상태로 한 번 확인" 용도.
#
#   docker compose -f compose.prod.yaml up -d --build
#
# 로컬 개발(IDE 에서 앱 실행)에는 쓰지 않는다. 그쪽은 compose.yaml 이 자동으로 뜬다.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homerun}
      POSTGRES_USER: ${POSTGRES_USER:-homerun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ['sh', '-c', 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # IMAGE 를 주면 그 이미지를 쓰고(= CD 가 올린 태그로 롤백 가능), 없으면 로컬에서 빌드한다.
    image: ${IMAGE:-homerun-backend:local}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-homerun}
      POSTGRES_USER: ${POSTGRES_USER:-homerun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?Set GOOGLE_REDIRECT_URI in .env}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?Set KAKAO_CLIENT_ID in .env}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?Set KAKAO_CLIENT_SECRET in .env}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?Set KAKAO_REDIRECT_URI in .env}
      # OAuth 제공자의 콜백은 백엔드로 받고, 성공 후 이 주소의 프론트 화면으로 이동한다.
      OAUTH_FRONTEND_REDIRECT_URI: ${OAUTH_FRONTEND_REDIRECT_URI:?Set OAUTH_FRONTEND_REDIRECT_URI in .env}
      # 쿠키 인증을 사용하는 브라우저 요청은 허용할 프론트 출처를 명시해야 한다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME}}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:?Set EMAIL_VERIFICATION_SECRET in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:-1800}
      REFRESH_TOKEN_EXPIRATION_DAYS: ${REFRESH_TOKEN_EXPIRATION_DAYS:-14}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      EXTERNAL_API_CONNECT_TIMEOUT: ${EXTERNAL_API_CONNECT_TIMEOUT:-3s}
      EXTERNAL_API_READ_TIMEOUT: ${EXTERNAL_API_READ_TIMEOUT:-5s}
      EXTERNAL_API_MAX_ATTEMPTS: ${EXTERNAL_API_MAX_ATTEMPTS:-2}
      EXTERNAL_API_RETRY_BACKOFF: ${EXTERNAL_API_RETRY_BACKOFF:-200ms}
      JUSO_CONFIRM_KEY: ${JUSO_CONFIRM_KEY:?Set JUSO_CONFIRM_KEY in .env}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:?Set DATA_GO_KR_SERVICE_KEY in .env}
      OPEN_BANKING_OAUTH_BASE_URL: ${OPEN_BANKING_OAUTH_BASE_URL:-https://openapi.openbanking.or.kr}
      OPEN_BANKING_API_BASE_URL: ${OPEN_BANKING_API_BASE_URL:-https://openapi.openbanking.or.kr}
      OPEN_BANKING_CLIENT_ID: ${OPEN_BANKING_CLIENT_ID:?Set OPEN_BANKING_CLIENT_ID in .env}
      OPEN_BANKING_CLIENT_SECRET: ${OPEN_BANKING_CLIENT_SECRET:?Set OPEN_BANKING_CLIENT_SECRET in .env}
      OPEN_BANKING_CLIENT_USE_CODE: ${OPEN_BANKING_CLIENT_USE_CODE:?Set OPEN_BANKING_CLIENT_USE_CODE in .env}
      OPEN_BANKING_REDIRECT_URI: ${OPEN_BANKING_REDIRECT_URI:?Set OPEN_BANKING_REDIRECT_URI in .env}
      OPEN_BANKING_SCOPE: ${OPEN_BANKING_SCOPE:-login inquiry}
      OPEN_BANKING_TOKEN_ENCRYPTION_KEY: ${OPEN_BANKING_TOKEN_ENCRYPTION_KEY:?Set OPEN_BANKING_TOKEN_ENCRYPTION_KEY in .env}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      # 서비스계정 JSON 을 base64 한 줄로 준다(파일 배치 불필요, 서버 .env 에 그대로 둔다).
      # FirebaseConfig 가 base64/원본 JSON/파일 경로를 모두 해석한다.
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      NOTIFICATION_DEADLINE_CRON: ${NOTIFICATION_DEADLINE_CRON:-0 0 9 * * *}
      NOTIFICATION_RECOVERY_MIN_AGE: ${NOTIFICATION_RECOVERY_MIN_AGE:-5m}
      NOTIFICATION_RECOVERY_BATCH_SIZE: ${NOTIFICATION_RECOVERY_BATCH_SIZE:-100}
      NOTIFICATION_RECOVERY_FIXED_DELAY: ${NOTIFICATION_RECOVERY_FIXED_DELAY:-60s}
    ports:
      - '${APP_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health/readiness || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # AI 코치 RAG 서비스(FastAPI + ChromaDB). Spring 과 같은 JWT_SECRET(HS256)을 공유해
  # 프론트가 8000 으로 직접 호출한다. ChromaDB 는 임베디드 persistent 모드(별도 서버 없음).
  ai-coach:
    image: ${AI_COACH_IMAGE:-homerun-ai-coach:local}
    build: ./ai-coach
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-10}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-1}
      # Spring 과 반드시 동일한 값이어야 토큰 검증이 통과한다.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CHROMA_DIR: ${CHROMA_DIR:-/data/chroma}
    ports:
      - '${AI_COACH_PORT:-8000}:8000'
    volumes:
      - chroma-data:/data/chroma
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen(''http://localhost:8000/health'').status==200 else sys.exit(1)"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  chroma-data:
