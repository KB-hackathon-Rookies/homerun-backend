plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.1'
}

group = 'com.homerun'
version = '0.0.1-SNAPSHOT'
description = 'homerun_backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 메트릭을 프로메테우스 형식으로 노출한다. actuator 만으로는 /actuator/prometheus 가 생기지 않는다.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    // Solapi(CoolSMS) 휴대전화 인증 문자 실발송 SDK.
    implementation 'net.nurigo:sdk:4.3.2'
    // FCM 푸시 전송. BOM 관리 대상이 아니라 버전을 직접 고정한다(착수 시 Maven Central 최신 9.4.x 확인).
    implementation 'com.google.firebase:firebase-admin:9.4.3'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // 테스트도 운영과 같은 PostgreSQL 에서 돌린다. H2 로 대신하면 Flyway 마이그레이션과
    // Postgres 전용 문법(JSONB, ON CONFLICT, 시퀀스 등)이 한 번도 검증되지 않는다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    // Testcontainers 2.x 부터 아티팩트 이름에 testcontainers- 접두사가 붙는다.
    // 버전은 Spring Boot BOM 이 관리한다(4.1.1 → 2.0.5).
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    // Gradle 기본 테스트 힙은 512m 이다. 테스트 클래스가 180개를 넘기면서 스프링 테스트
    // 컨텍스트 캐시가 20개 넘는 컨텍스트를 동시에 들고 있게 됐고, 거기서 512m 가 아슬아슬해졌다.
    // 실제로 컨텍스트 하나를 더하자 "Java heap space" 로 스위트 끝에서 무너졌다.
    // 남은 여유가 없어서 다음 테스트를 넣는 사람이 자기 코드와 무관한 OOM 을 만나게 된다.
    maxHeapSize = '1g'
    finalizedBy jacocoTestReport
}

// 커버리지 리포트. 목표는 점진적으로 1.0 이다. 하락 방지 게이트는 아래
// jacocoTestCoverageVerification 이 건다 — 현재 수치 바로 아래에 floor 를 두고, 커버리지가
// 오르면 floor 도 함께 올려 간다.
// 리포트: build/reports/jacoco/test/html/index.html
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // 부팅 진입점만 분모에서 뺀다 — 테스트 대상이 아니다. dto/entity/type 은 로직이 섞여 있어
    // 일단 포함하고, 리포트를 보고 노이즈가 크면 그때 좁힌다.
    afterEvaluate {
        classDirectories.setFrom(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/HomerunApplication*'])
        })
    }
}

// 커버리지 하락 방지 게이트. 현재 수치(INSTRUCTION 87.6% · LINE 87.9% · BRANCH 72.3%,
// HomerunApplication 제외 기준) 바로 아래에 floor 를 둬, 눈금 흔들림엔 안 걸리고 의미 있는
// 하락만 빌드를 깬다. 커버리지가 오르면 이 값도 함께 올린다. check(→ build)에 붙는다.
jacocoTestCoverageVerification {
    dependsOn test
    // 리포트와 같은 분모를 본다 — 부팅 진입점 제외.
    afterEvaluate {
        classDirectories.setFrom(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/HomerunApplication*'])
        })
    }
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// PR 체크리스트의 "코드 포맷팅을 적용했습니다"를 사람 손에 맡기지 않는다.
// spotlessCheck 는 check → build 에 자동으로 붙으므로 CI 에서도 같이 걸린다.
// 포맷이 깨졌을 때 고치는 명령은 ./gradlew spotlessApply
spotless {
    java {
        target 'src/*/java/**/*.java'
        // google-java-format 은 들여쓰기가 2칸이라 Spring 계열 기존 코드와 diff 가 크다.
        // palantir 는 4칸이라 지금 코드 스타일을 그대로 유지한 채 강제만 걸 수 있다.
        palantirJavaFormat('2.97.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
