# 로컬 개발용. 앱이 의존하는 서비스만 둔다.
#
# 여기에 app 서비스를 넣으면 안 된다. spring-boot-docker-compose(developmentOnly)가
# 앱을 실행할 때 이 파일의 서비스를 전부 띄우기 때문에, app 이 들어 있으면
# 앱을 켤 때마다 자기 자신을 다시 빌드해서 컨테이너로 올리고 8080 포트를 두고 충돌한다.
# 앱까지 컨테이너로 묶어 돌리려면 compose.prod.yaml 을 쓴다.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homerun}
      POSTGRES_USER: ${POSTGRES_USER:-homerun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
