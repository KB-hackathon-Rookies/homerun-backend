# 로컬 개발용. 앱이 의존하는 서비스만 둔다.
#
# 여기에 app 서비스를 넣으면 안 된다. spring-boot-docker-compose(developmentOnly)가
# 앱을 실행할 때 이 파일의 서비스를 전부 띄우기 때문에, app 이 들어 있으면
# 앱을 켤 때마다 자기 자신을 다시 빌드해서 컨테이너로 올리고 8080 포트를 두고 충돌한다.
# 앱까지 컨테이너로 묶어 돌리려면 compose.prod.yaml 을 쓴다.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homerun}
      POSTGRES_USER: ${POSTGRES_USER:-homerun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Spring Boot의 Docker Compose Redis 연결 정보는 비밀번호를 지원하지 않는다.
    # 이 서비스는 app의 spring.data.redis.* 설정(REDIS_PASSWORD 포함)을 사용한다.
    labels:
      org.springframework.boot.ignore: "true"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ['sh', '-c', 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
